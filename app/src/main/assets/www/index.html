<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jewelry Khatabook Ledger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8f9fa; color: #212529; padding: 16px; }
        .header { background: linear-gradient(135deg, #d4af37, #aa7c11); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .btn { background-color: #d4af37; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-upi { background-color: #5f259f; }
        .btn-call { background-color: #007bff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Jewelry Khatabook</h1>
        <p>Offline Jewelry Ledger & Bullion Rates</p>
    </div>

    <div class="card">
        <h3>Live Rates</h3>
        <p>Gold (24K/10g): <strong>₹75,450</strong></p>
        <p>Silver (1kg): <strong>₹88,200</strong></p>
    </div>

    <div class="card">
        <h3>Customer Action Shortcuts</h3>
        <button class="btn btn-whatsapp" onclick="shareReceipt()">Share Receipt via WhatsApp</button>
        <button class="btn btn-upi" onclick="payViaUPI()">Pay Balance via UPI</button>
        <button class="btn btn-call" onclick="callCustomer()">Call Customer</button>
    </div>

    <script>
        function shareReceipt() {
            window.location.href = "https://wa.me/919876543210?text=" + encodeURIComponent("Your Jewelry Khatabook Balance Receipt");
        }
        function payViaUPI() {
            window.location.href = "upi://pay?pa=jeweler@upi&pn=JewelryKhatabook&am=10000&cu=INR";
        }
        function callCustomer() {
            window.location.href = "tel:+919876543210";
        }
    </script>
</body>
</html>
